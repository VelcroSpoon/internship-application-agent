# What the Screener is looking for. Edit freely; unknown keys are rejected.

[candidate]
# Markdown file the Screener and Writer treat as the sole source of truth
# about you. Relative paths resolve against the repo root.
master_resume_path = "config/master_resume.md"

[criteria]
target_cycle = "Summer 2027"
# What kinds of roles you want. Shown to the model as the target, in words.
target_roles = [
    "software engineering internship with an AI/ML focus",
    "machine learning engineering internship",
    "applied AI / LLM infrastructure internship",
]
# Locations you can actually work from. The model treats anything else as a
# disqualifier unless the posting says remote.
acceptable_locations = ["Montreal, QC", "Toronto, ON", "Remote (Canada)", "Remote (US)"]
# Fit score at or above this lands in the drafting queue.
queue_threshold = 70

# Hard disqualifiers: case-insensitive regexes run against the posting text IN
# CODE, never shown to the model. A hit caps the stored fit score at 30 and
# records the label. Deliberate: a 3B model given this list as a checklist
# copied it back verbatim as "missing requirements" instead of reading the
# posting. Keep patterns specific; "3+ years" matches nice-to-have lines too.
[[criteria.hard_disqualifiers]]
label = "security clearance required"
pattern = "(active|current|eligible for)?\\s*(security clearance|TS/SCI|top secret)"

[[criteria.hard_disqualifiers]]
label = "PhD required"
pattern = "\\b(PhD|doctoral)\\b.{0,40}\\b(required|enrolled|candidate|student)\\b"

[[criteria.hard_disqualifiers]]
label = "US citizenship required"
pattern = "\\bU\\.?S\\.? citizen(ship)?\\b.{0,20}\\brequired\\b"

[prefilter]
# Case-insensitive regexes. A posting whose title matches NONE of these gets a
# zero-score screening row from the 'prefilter' model and never reaches the
# LLM. Empty list = screen every posting (slow on CPU-only machines).
title_patterns = ["\\bintern(ship)?\\b", "\\bco-?op\\b", "summer 20\\d\\d", "\\bnew grad\\b"]

[screener]
# Local and free, but a coarse filter: this 3B model echoes lists from its own
# prompt back as findings, and takes ~23s per posting on CPU. The better option
# needs an Anthropic credential; switch with:
#   backend = "anthropic"
#   model = "claude-haiku-4-5"
# which reads the posting rather than the prompt, at about a tenth of a cent
# each. The title pre-filter below means only a handful reach the model either
# way.
backend = "ollama"
model = "qwen2.5:3b"
ollama_host = "http://localhost:11434"
# Postings are truncated to this many characters before prompting. Greenhouse
# descriptions run 7-10k characters and the requirements are almost always in
# the first half.
description_max_chars = 6000
# One retry on schema failure, then skip the posting until the next run.
max_attempts = 2

[writer]
# The Writer drafts bullets and a cover letter. Hosted model by default: this
# runs maybe ten times a week and quality matters more than cost here.
# A draft is roughly 3k tokens in, 1.5k out: about five cents on Opus.
backend = "anthropic"
model = "claude-opus-5"
effort = "medium"
max_attempts = 2

[critic]
# The Critic scores drafts against the fixed rubric in
# internship_agent/agents/critic.py. It never rewrites. Sonnet: judging
# against anchors is cheaper work than drafting, and a 3-round loop calls it
# three times per application.
backend = "anthropic"
model = "claude-sonnet-5"
effort = "medium"
max_attempts = 2
