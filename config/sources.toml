# Discovery sources for the nightly Scout run.
#
# Edit this file, not the code, to add or remove boards. Unknown keys are
# rejected at load time so a typo fails the run instead of being ignored.

[scout]
# Sent on every request. Keep a contact address in it; it is the polite thing
# to do and some hosts block anonymous agents.
user_agent = "InternshipApplicationAgent/0.1 (+https://github.com/VelcroSpoon/internship-application-agent)"

# Pause between boards. Minimum enforced is 1.0s; this is deliberately slower.
delay_seconds = 3.0

# Greenhouse boards. `board` is the token in the public URL:
# https://job-boards.greenhouse.io/<board>/ . `company` overrides the name the
# API reports, useful when a board token is not a readable name.
#
# Chosen on 2026-09-22 by probing each board's live API: kept if it lists
# engineering or ML internships now, or is an AI lab whose internships are
# seasonal. Boards whose only interns were sales, design or accounting were
# left out (samsara). Add or remove freely; unknown boards fail loudly as a
# 404 in the nightly log rather than silently.

[[scout.greenhouse]]
board = "scaleai"
company = "Scale AI"

[[scout.greenhouse]]
board = "anthropic"   # no internships listed on 2026-09-22; they post seasonally

[[scout.greenhouse]]
board = "databricks"

[[scout.greenhouse]]
board = "datadog"     # applied science internships

[[scout.greenhouse]]
board = "stripe"

[[scout.greenhouse]]
board = "robinhood"   # some internships list Toronto or remote

[[scout.greenhouse]]
board = "lyft"        # most internships here list Toronto or remote

[[scout.greenhouse]]
board = "dropbox"     # remote internships

[[scout.greenhouse]]
board = "coinbase"

[[scout.greenhouse]]
board = "figma"

[[scout.greenhouse]]
board = "duolingo"

[scheduler]
# The nightly discovery run: scout every board, then screen what is new.
# Discovery only. Drafting costs money and produces something you have to
# read, so it never fires on a timer.
enabled = true
hour = 3
minute = 0
timezone = "America/Toronto"
