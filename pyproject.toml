[project]
name = "internship-agent"
version = "0.1.0"
description = "Multi-agent internship application assistant: discovers postings and drafts tailored materials. Never submits."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "anthropic>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["internship_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# critic.py is the spec file. It is not edited, so it is not linted or formatted.
"internship_agent/agents/critic.py" = ["ALL"]

[tool.ruff.format]
exclude = ["internship_agent/agents/critic.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
